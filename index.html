<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hebrew Lesson</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dce7df; }
    :root { --lesson-height: 100vh; }
    body { perspective: 1800px; }
    .page { position: absolute; inset: 0; display: grid; place-items: center; background: #dce7df; backface-visibility: hidden; }
    .page::before { content: ''; position: absolute; width: min(86vw, calc(var(--lesson-height) * 0.86)); height: min(82vw, calc(var(--lesson-height) * 0.82)); background: white; border: 2px solid #ff1616; box-shadow: 2px 3px 5px #0004; pointer-events: none; }
    .letter { position: relative; font-family: 'Times New Roman', 'Noto Serif Hebrew', serif; font-size: min(62vw, calc(var(--lesson-height) * 0.62)); line-height: 1.2; color: #111; }
    .letter.vowel { width: min(44vw, calc(var(--lesson-height) * 0.44)); height: min(44vw, calc(var(--lesson-height) * 0.44)); }
    .letter.vowel svg { display: block; width: 100%; height: 100%; fill: #111; stroke: none; }
    .letter.practice { font-size: min(54vw, calc(var(--lesson-height) * 0.54)); }
    .letter.pair { font-size: min(32vw, calc(var(--lesson-height) * 0.32)); white-space: pre; direction: rtl; }
    .letter { cursor: pointer; }
    .letter:focus-visible { outline: 2px solid #52695b; outline-offset: 12px; }
    #sound { position: fixed; z-index: 6; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(90vw, 680px); max-height: 40vh; overflow: auto; padding: 16px 52px 16px 22px; border: 1px solid #a4b7aa; border-radius: 12px; background: #f7faf7; box-shadow: 0 4px 22px #0002; color: #182b20; font: clamp(17px, 2.3vw, 22px)/1.5 Arial, sans-serif; }
    #sound p { margin: 4px 0; }
    #sound-close { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; padding: 0; font: 28px Arial, sans-serif; }
    button { position: fixed; top: max(20px, env(safe-area-inset-top)); width: 64px; height: 64px; padding: 12px; border: 0; background: transparent; color: #111; cursor: pointer; z-index: 5; border-radius: 50%; }
    button:hover { background: #f2f2f2; }
    button:focus-visible { outline: 3px solid #555; outline-offset: 3px; }
    button:disabled { cursor: default; }
    button[hidden] { display: none; }
    #back { left: max(20px, env(safe-area-inset-left)); }
    #beginning { left: calc(max(20px, env(safe-area-inset-left)) + 100px); }
    #sections { position: fixed; z-index: 5; left: calc(75vw + min(21.5vw, 21.5vh) - 26px); top: calc(50vh - min(41vw, 41vh)); transform: translateX(-50%); width: auto; max-width: calc(100vw - 40px); padding: 2px; border: 2px inset #ddd; border-radius: 0; background: white; color: #111; font: 16px/1.4 "Segoe UI", Arial, sans-serif; }
    #sections option { padding: 3px 6px; }
    #sections:focus-visible { outline: 2px solid #0078d4; outline-offset: 2px; }
    #next { right: max(20px, env(safe-area-inset-right)); }
    svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .turning-sheet { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    @media (max-width: 760px), (pointer: coarse) {
      :root { --lesson-height: calc(100dvh - 148px); }
      .page { top: 148px; }
      #sections { top: max(8px, env(safe-area-inset-top)); left: 50%; width: max-content; max-width: calc(100vw - 24px); height: 74px; overflow-y: auto; }
      #back, #beginning, #next { top: 90px; width: 48px; height: 48px; padding: 8px; }
      #beginning { left: calc(max(20px, env(safe-area-inset-left)) + 64px); }
    }
  </style>
</head>
<body>
  <main id="book" aria-live="polite"><div class="page"><span class="letter" lang="he" aria-label="Aleph">א</span></div></main>
  <button id="back" aria-label="Previous page" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M27 16H5m10-10L5 16l10 10"/></svg></button>
  <button id="beginning" aria-label="Return to beginning" hidden><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M18 6L8 16l10 10M32 6L22 16l10 10"/></svg></button>
  <button id="next" aria-label="Next letter"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22M17 6l10 10-10 10"/></svg></button>
  <select id="sections" size="17" aria-label="Lesson sections" lang="en" dir="ltr">
    <option value="0" selected>Aleph - Daled</option>
    <option value="5">Aleph - Daled practice</option>
    <option value="15">Ah - Eh</option>
    <option value="18">Ah - Eh practice</option>
    <option value="27">Combined practice</option>
    <option value="39">Two letter practice</option>
    <option value="51">Heh - Chet</option>
    <option value="55">Heh - Chet practice</option>
    <option value="63">Heh - Chet combined practice</option>
    <option value="75">Heh - Chet two letter practice</option>
    <option value="87">Tet - Yud</option>
    <option value="89">Tet - Yud practice</option>
    <option value="93">Tet - Yud combined practice</option>
    <option value="99">Tet - Yud two letter practice</option>
    <option value="111">Chiriq - Tzerai - Kubutz</option>
    <option value="114">Chiriq - Tzerai - Kubutz practice</option>
    <option value="120">All letters with new vowels</option>
  </select>
  <aside id="sound" lang="en" dir="ltr" aria-live="polite" hidden><div id="sound-text"></div><button id="sound-close" aria-label="Close sound example">×</button></aside>
  <script>
    const letters = [
      ['א', 'Aleph'], ['בּ', 'Bet'], ['ב', 'Vet'], ['ג', 'Gimmel'], ['ד', 'Daled'],
      ['\u05b8', 'Kamatz', 'M18 34H82V44H55V66H45V44H18Z'],
      ['\u05b7', 'Patach', 'M18 45H82V55H18Z'],
      ['\u05b6', 'Segol', 'M39 34A7 7 0 1 1 25 34A7 7 0 1 1 39 34ZM75 34A7 7 0 1 1 61 34A7 7 0 1 1 75 34ZM57 66A7 7 0 1 1 43 66A7 7 0 1 1 57 66Z']
    ];
    const learnedLetters = letters.slice(0, 5);
    const learnedVowels = letters.slice(5, 8);
    function shuffled(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }
    const practiceCombinations = learnedLetters.flatMap(([letter, name]) =>
      learnedVowels.map(([vowel, vowelName]) => [
        (letter + vowel).normalize('NFC'), `${name} with ${vowelName}`, null, 'practice'
      ])
    );
    // Shuffle once per visit so going back preserves the same practice page.
    const letterReview = shuffled([...learnedLetters, ...learnedLetters]);
    letters.splice(5, 0, ...letterReview);
    letters.push(...shuffled([...learnedVowels, ...learnedVowels, ...learnedVowels]));
    letters.push(...shuffled(practiceCombinations).slice(0, 12));
    const pairCombinations = practiceCombinations.flatMap(first =>
      practiceCombinations.filter(second =>
        first[1].split(' with ')[0] !== second[1].split(' with ')[0]
        && first[1].split(' with ')[1] !== second[1].split(' with ')[1]
      ).map(second => [
        `${first[0]}${second[0]}`, `${first[1]}, then ${second[1]}`, null, 'pair'
      ])
    );
    letters.push(...shuffled(pairCombinations).slice(0, 12));
    const nextLetters = [['ה', 'Heh'], ['ו', 'Vav'], ['ז', 'Zayin'], ['ח', 'Chet']];
    letters.push(...nextLetters, ...shuffled([...nextLetters, ...nextLetters]));
    const nextPracticeCombinations = nextLetters.flatMap(([letter, name]) =>
      learnedVowels.map(([vowel, vowelName]) => [
        (letter + vowel).normalize('NFC'), `${name} with ${vowelName}`, null, 'practice'
      ])
    );
    letters.push(...shuffled(nextPracticeCombinations));
    const nextPairCombinations = nextPracticeCombinations.flatMap(first =>
      nextPracticeCombinations.filter(second =>
        first[1].split(' with ')[0] !== second[1].split(' with ')[0]
        && first[1].split(' with ')[1] !== second[1].split(' with ')[1]
      ).map(second => [
        `${first[0]}${second[0]}`, `${first[1]}, then ${second[1]}`, null, 'pair'
      ])
    );
    letters.push(...shuffled(nextPairCombinations).slice(0, 12));
    const tetYudLetters = [['ט', 'Tet'], ['י', 'Yud']];
    letters.push(...tetYudLetters, ...shuffled([...tetYudLetters, ...tetYudLetters]));
    const tetYudPracticeCombinations = tetYudLetters.flatMap(([letter, name]) =>
      learnedVowels.map(([vowel, vowelName]) => [
        (letter + vowel).normalize('NFC'), `${name} with ${vowelName}`, null, 'practice'
      ])
    );
    letters.push(...shuffled(tetYudPracticeCombinations));
    const tetYudPairCombinations = tetYudPracticeCombinations.flatMap(first =>
      tetYudPracticeCombinations.filter(second =>
        first[1].split(' with ')[0] !== second[1].split(' with ')[0]
        && first[1].split(' with ')[1] !== second[1].split(' with ')[1]
      ).map(second => [
        `${first[0]}${second[0]}`, `${first[1]}, then ${second[1]}`, null, 'pair'
      ])
    );
    letters.push(...shuffled(tetYudPairCombinations).slice(0, 12));
    const newVowels = [['\u05b4', 'Chiriq'], ['\u05b5', 'Tzerai'], ['\u05bb', 'Kubutz']];
    const alephNewVowels = newVowels.map(([vowel, name]) => [
      ('א' + vowel).normalize('NFC'), `Aleph with ${name}`, null, 'practice'
    ]);
    letters.push(...alephNewVowels, ...shuffled([...alephNewVowels, ...alephNewVowels]));
    const allLearnedLetters = [...learnedLetters, ...nextLetters, ...tetYudLetters];
    const allLettersNewVowels = allLearnedLetters.flatMap(([letter, name]) =>
      newVowels.map(([vowel, vowelName]) => [
        (letter + vowel).normalize('NFC'), `${name} with ${vowelName}`, null, 'practice'
      ])
    );
    letters.push(...shuffled(allLettersNewVowels));
    const sections = document.getElementById('sections');
    function updateSection() {
      const starts = [...sections.options].map(option => Number(option.value));
      sections.selectedIndex = starts.findLastIndex(start => start <= index);
    }
    const book = document.getElementById('book');
    const back = document.getElementById('back');
    const beginning = document.getElementById('beginning');
    const next = document.getElementById('next');
    const sound = document.getElementById('sound');
    const soundText = document.getElementById('sound-text');
    const soundExamples = {
      Aleph: 'Aleph — no consonant sound, like the silent “k” in “knee.” A vowel gives it a sound.',
      Bet: 'Bet — “b” as in “ball.”',
      Vet: 'Vet — “v” as in “van.”',
      Gimmel: 'Gimmel — hard “g” as in “goat.”',
      Daled: 'Daled — “d” as in “dog.”',
      Heh: 'Heh — “h” as in “house.”',
      Vav: 'Vav — “v” as in “van.”',
      Zayin: 'Zayin — “z” as in “zebra.”',
      Chet: 'Chet — a throaty “ch,” as in “Bach.”',
      Tet: 'Tet — “t” as in “top.”',
      Yud: 'Yud — “y” as in “yes.”',
      Kamatz: 'Kamatz — “ah” as in “father.”',
      Patach: 'Patach — “ah” as in “father.”',
      Segol: 'Segol — “eh” as in “bed.”',
      Chiriq: 'Chiriq — “ee” as in “see.”',
      Tzerai: 'Tzerai — “ay” as in “day.”',
      Kubutz: 'Kubutz — “oo” as in “food.”'
    };
    function hideSound() {
      sound.hidden = true;
      book.querySelectorAll('.letter').forEach(glyph => glyph.setAttribute('aria-expanded', 'false'));
    }
    function showSound(glyph, name) {
      if (turning) return;
      if (!sound.hidden) { hideSound(); return; }
      soundText.replaceChildren();
      const names = [...new Set(name.split(/, then | with /))];
      names.forEach(item => {
        const line = document.createElement('p');
        line.textContent = soundExamples[item];
        soundText.append(line);
      });
      sound.hidden = false;
      glyph.setAttribute('aria-expanded', 'true');
    }
    function enableSound(glyph, name) {
      glyph.setAttribute('role', 'button');
      glyph.tabIndex = 0;
      glyph.setAttribute('aria-controls', 'sound');
      glyph.setAttribute('aria-expanded', 'false');
      glyph.addEventListener('click', () => showSound(glyph, name));
      glyph.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          showSound(glyph, name);
        }
      });
    }
    let index = 0;
    let turning = false;
    let pendingSection = null;
    function turn(direction) {
      const target = index + direction;
      if (turning || target === index || target < 0 || target >= letters.length) return;
      hideSound();
      turning = true;
      back.disabled = beginning.disabled = next.disabled = true;
      const outgoing = book.firstElementChild;
      const incoming = document.createElement('div');
      incoming.className = 'page';
      const letter = document.createElement('span');
      letter.className = 'letter';
      if (letters[target][3] === 'practice') letter.classList.add('practice');
      if (letters[target][3] === 'pair') letter.classList.add('pair');
      letter.lang = 'he';
      letter.dir = 'rtl';
      letter.textContent = letters[target][0];
      letter.setAttribute('aria-label', letters[target][1]);
      if (letters[target][2]) {
        // Draw standalone vowel marks without an automatic dotted-circle base.
        letter.classList.add('vowel');
        letter.dataset.vowel = letters[target][2];
        letter.setAttribute('role', 'img');
        letter.textContent = '';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', letters[target][2]);
        svg.append(path);
        letter.append(svg);
      }
      incoming.append(letter);
      enableSound(letter, letters[target][1]);
      book.prepend(incoming);
      centerGlyph(letter);
      outgoing.setAttribute('aria-hidden', 'true');
      animatePage(outgoing, direction, () => {
        outgoing.remove();
        index = target;
        back.hidden = index === 0;
        beginning.hidden = index === 0;
        next.hidden = index === letters.length - 1;
        back.disabled = beginning.disabled = next.disabled = false;
        updateSection();
        turning = false;
        if (pendingSection !== null) {
          const destination = pendingSection;
          pendingSection = null;
          turn(destination - index);
        }
        if (document.activeElement.hidden) (direction > 0 ? back : next).focus();
      });
    }
    function glyphBaseline(glyph) {
      const marker = document.createElement('span');
      marker.style.cssText = 'display:inline-block;width:0;height:0;padding:0;margin:0;border:0;vertical-align:baseline';
      glyph.append(marker);
      const baseline = marker.getBoundingClientRect().top;
      marker.remove();
      return baseline;
    }
    function centerGlyph(glyph) {
      if (glyph.dataset.vowel) return;
      glyph.style.transform = 'none';
      const style = getComputedStyle(glyph);
      const context = document.createElement('canvas').getContext('2d');
      context.font = `${style.fontSize} ${style.fontFamily}`;
      context.textAlign = 'center';
      context.direction = 'rtl';
      const metrics = context.measureText(glyph.textContent);
      const baseline = glyphBaseline(glyph);
      const bounds = glyph.getBoundingClientRect();
      // Center the visible ink, including vowel marks, rather than the font line box.
      const inkX = bounds.left + bounds.width / 2
        + (metrics.actualBoundingBoxRight - metrics.actualBoundingBoxLeft) / 2;
      const inkY = baseline
        + (metrics.actualBoundingBoxDescent - metrics.actualBoundingBoxAscent) / 2;
      const pageBounds = glyph.parentElement.getBoundingClientRect();
      glyph.style.transform = `translate(${pageBounds.left + pageBounds.width / 2 - inkX}px, ${pageBounds.top + pageBounds.height / 2 - inkY}px)`;
    }
    function animatePage(page, direction, finish) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
      const frameStyle = getComputedStyle(page, '::before');
      const width = parseFloat(frameStyle.width), height = parseFloat(frameStyle.height);
      const pageBounds = page.getBoundingClientRect();
      const originX = pageBounds.left + (pageBounds.width - width) / 2;
      const originY = pageBounds.top + (pageBounds.height - height) / 2;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      const texture = document.createElement('canvas');
      texture.width = Math.round(width * ratio);
      texture.height = Math.round(height * ratio);
      const ink = texture.getContext('2d');
      ink.scale(ratio, ratio);
      ink.fillStyle = 'white';
      ink.fillRect(0, 0, width, height);
      // Include the frame in the sheet texture so it curls with the letter.
      ink.strokeStyle = '#ff1616';
      ink.lineWidth = 2;
      ink.strokeRect(1, 1, width - 2, height - 2);
      const glyph = page.querySelector('.letter');
      const style = getComputedStyle(glyph);
      if (glyph.dataset.vowel) {
        const bounds = glyph.getBoundingClientRect();
        ink.save();
        ink.translate(bounds.left - originX, bounds.top - originY);
        ink.scale(bounds.width / 100, bounds.height / 100);
        ink.fillStyle = style.color;
        ink.fill(new Path2D(glyph.dataset.vowel));
        ink.restore();
      } else {
      // Measure the actual DOM baseline; canvas "middle" uses different font metrics
      // and makes the letter jump when the animated sheet replaces the HTML page.
      const baseline = glyphBaseline(glyph);
      const bounds = glyph.getBoundingClientRect();
      ink.font = `${style.fontSize} ${style.fontFamily}`;
      ink.fillStyle = style.color;
      ink.textAlign = 'center';
      ink.direction = 'rtl';
      ink.textBaseline = 'alphabetic';
      ink.fillText(glyph.textContent, bounds.left + bounds.width / 2 - originX, baseline - originY);
      }
      const sheet = document.createElement('canvas');
      sheet.className = 'turning-sheet';
      sheet.style.filter = 'drop-shadow(2px 3px 2px #0004)';
      sheet.setAttribute('aria-hidden', 'true');
      sheet.width = Math.round(innerWidth * ratio);
      sheet.height = Math.round(innerHeight * ratio);
      document.body.append(sheet);
      page.style.visibility = 'hidden';
      const ctx = sheet.getContext('2d');
      const strips = 100, step = width / strips;
      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / 2800, 1);
        ctx.setTransform(ratio, 0, 0, ratio, originX * ratio, originY * ratio);
        ctx.clearRect(-originX, -originY, innerWidth, innerHeight);
        // Fan several thin sheets beneath the letter page, then settle them together.
        for (let layer = 4; layer >= 0; layer--) {
        const phase = Math.min(progress + layer * 0.035 * Math.sin(progress * Math.PI), 1);
        const eased = phase * phase * (3 - 2 * phase);
        const flutter = Math.sin(progress * Math.PI) ** 2;
        let x = 0, z = 0;
        // Integrate a curved sheet: its free edge rises and curls over the spine.
        for (let i = 0; i < strips; i++) {
          const position = (i + 0.5) / strips;
          const ripple = Math.sin(position * Math.PI * 4 - progress * Math.PI * 6 + layer * 0.6);
          const angle = eased * Math.PI + Math.sin(eased * Math.PI) * position * 0.85
            + ripple * flutter * position * 0.13;
          const nextX = x + Math.cos(angle) * step;
          const nextZ = z + Math.sin(angle) * step;
          const project = (horizontal, depth) => {
            const scale = 1 + depth / (width * 2.5);
            return {
              x: direction > 0 ? horizontal * scale : width - horizontal * scale,
              y: height / 2 - height * scale / 2 - Math.sin(eased * Math.PI) * position * height * 0.12
                + flutter * (ripple * position * 9 + layer * 5),
              h: height * scale
            };
          };
          const left = project(x, z), right = project(nextX, nextZ);
          const dx = right.x - left.x;
          if (Math.abs(dx) > 0.01) {
            ctx.save();
            ctx.transform(dx / step, (right.y - left.y) / step, 0, left.h / height, left.x, left.y);
            if (Math.cos(angle) > 0 && layer === 0) {
              const sourceX = direction > 0 ? i * step : width - (i + 1) * step;
              if (direction < 0) { ctx.translate(step, 0); ctx.scale(-1, 1); }
              ctx.drawImage(texture, sourceX * ratio, 0, step * ratio, texture.height, 0, 0, step + 0.7, height);
              ctx.fillStyle = `rgba(0,0,0,${Math.sin(angle) * 0.12})`;
            } else {
              ctx.fillStyle = layer === 0 ? '#faf9f6' : ['#fff', '#f6f5f2', '#eeede9', '#faf9f6', '#e8e7e3'][layer];
              ctx.fillRect(0, 0, step + 0.7, height);
              ctx.fillStyle = `rgba(0,0,0,${Math.abs(Math.sin(angle)) * 0.16})`;
            }
            ctx.fillRect(0, 0, step + 0.7, height);
            ctx.restore();
          }
          x = nextX;
          z = nextZ;
        }
        // A fine free-edge line makes the separate ruffling leaves visible.
        if (flutter > 0.001) {
          const scale = 1 + z / (width * 2.5);
          const edgeX = direction > 0 ? x * scale : width - x * scale;
          const edgeRipple = Math.sin(Math.PI * 4 - progress * Math.PI * 6 + layer * 0.6);
          const edgeY = height / 2 - height * scale / 2 - Math.sin(eased * Math.PI) * height * 0.12
            + flutter * (edgeRipple * 9 + layer * 5);
          ctx.beginPath();
          ctx.moveTo(edgeX, edgeY);
          ctx.lineTo(edgeX, edgeY + height * scale);
          ctx.strokeStyle = `rgba(90,85,75,${flutter * 0.26})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        }
        if (progress < 1) requestAnimationFrame(frame);
        else { sheet.remove(); finish(); }
      }
      requestAnimationFrame(frame);
    }
    sections.addEventListener('change', () => {
      const destination = Number(sections.value);
      if (turning) pendingSection = destination;
      else turn(destination - index);
    });
    back.addEventListener('click', () => turn(-1));
    beginning.addEventListener('click', () => { if (index > 0) turn(-index); });
    next.addEventListener('click', () => turn(1));
    enableSound(book.firstElementChild.querySelector('.letter'), 'Aleph');
    document.getElementById('sound-close').addEventListener('click', () => {
      hideSound();
      book.firstElementChild.querySelector('.letter').focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !sound.hidden) {
        hideSound();
        book.firstElementChild.querySelector('.letter').focus();
      }
    });
    document.fonts.ready.then(() => centerGlyph(book.firstElementChild.querySelector('.letter')));
    window.addEventListener('resize', () => {
      document.querySelectorAll('.page .letter').forEach(centerGlyph);
    });
  </script>
</body>
</html>
