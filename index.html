<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hebrew Lesson</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: white; }
    body { perspective: 1800px; }
    .page { position: absolute; inset: 0; display: grid; place-items: center; background: white; backface-visibility: hidden; }
    .letter { font-family: 'Times New Roman', 'Noto Serif Hebrew', serif; font-size: min(65vw, 72vh); line-height: 1.2; color: #111; }
    button { position: fixed; top: max(20px, env(safe-area-inset-top)); width: 64px; height: 64px; padding: 12px; border: 0; background: transparent; color: #111; cursor: pointer; z-index: 5; border-radius: 50%; }
    button:hover { background: #f2f2f2; }
    button:focus-visible { outline: 3px solid #555; outline-offset: 3px; }
    button:disabled { cursor: default; }
    button[hidden] { display: none; }
    #back { left: max(20px, env(safe-area-inset-left)); }
    #next { right: max(20px, env(safe-area-inset-right)); }
    svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .turning-sheet { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  </style>
</head>
<body>
  <main id="book" aria-live="polite"><div class="page"><span class="letter" lang="he" aria-label="Aleph">א</span></div></main>
  <button id="back" aria-label="Previous letter" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M27 16H5m10-10L5 16l10 10"/></svg></button>
  <button id="next" aria-label="Next letter"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22M17 6l10 10-10 10"/></svg></button>
  <script>
    const letters = [ ['א', 'Aleph'], ['בּ', 'Bet'], ['ב', 'Vet'], ['ג', 'Gimmel'] ];
    const book = document.getElementById('book');
    const back = document.getElementById('back');
    const next = document.getElementById('next');
    let index = 0;
    let turning = false;
    function turn(direction) {
      const target = index + direction;
      if (turning || target < 0 || target >= letters.length) return;
      turning = true;
      back.disabled = next.disabled = true;
      const outgoing = book.firstElementChild;
      const incoming = document.createElement('div');
      incoming.className = 'page';
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.lang = 'he';
      letter.textContent = letters[target][0];
      letter.setAttribute('aria-label', letters[target][1]);
      incoming.append(letter);
      book.prepend(incoming);
      outgoing.setAttribute('aria-hidden', 'true');
      animatePage(outgoing, direction, () => {
        outgoing.remove();
        index = target;
        back.hidden = index === 0;
        next.hidden = index === letters.length - 1;
        back.disabled = next.disabled = false;
        turning = false;
        if (document.activeElement.hidden) (direction > 0 ? back : next).focus();
      });
    }
    function animatePage(page, direction, finish) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
      const width = innerWidth, height = innerHeight;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      const texture = document.createElement('canvas');
      texture.width = Math.round(width * ratio);
      texture.height = Math.round(height * ratio);
      const ink = texture.getContext('2d');
      ink.scale(ratio, ratio);
      ink.fillStyle = 'white';
      ink.fillRect(0, 0, width, height);
      const glyph = page.querySelector('.letter');
      const bounds = glyph.getBoundingClientRect();
      const style = getComputedStyle(glyph);
      ink.font = `${style.fontSize} ${style.fontFamily}`;
      ink.fillStyle = style.color;
      ink.textAlign = 'center';
      ink.textBaseline = 'middle';
      ink.fillText(glyph.textContent, width / 2, bounds.top + bounds.height / 2);
      const sheet = document.createElement('canvas');
      sheet.className = 'turning-sheet';
      sheet.setAttribute('aria-hidden', 'true');
      sheet.width = texture.width;
      sheet.height = texture.height;
      document.body.append(sheet);
      page.style.visibility = 'hidden';
      const ctx = sheet.getContext('2d');
      const strips = 100, step = width / strips;
      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / 2800, 1);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        // Fan several thin sheets beneath the letter page, then settle them together.
        for (let layer = 4; layer >= 0; layer--) {
        const phase = Math.min(progress + layer * 0.035 * Math.sin(progress * Math.PI), 1);
        const eased = phase * phase * (3 - 2 * phase);
        const flutter = Math.sin(progress * Math.PI) ** 2;
        let x = 0, z = 0;
        // Integrate a curved sheet: its free edge rises and curls over the spine.
        for (let i = 0; i < strips; i++) {
          const position = (i + 0.5) / strips;
          const ripple = Math.sin(position * Math.PI * 4 - progress * Math.PI * 6 + layer * 0.6);
          const angle = eased * Math.PI + Math.sin(eased * Math.PI) * position * 0.85
            + ripple * flutter * position * 0.13;
          const nextX = x + Math.cos(angle) * step;
          const nextZ = z + Math.sin(angle) * step;
          const project = (horizontal, depth) => {
            const scale = 1 + depth / (width * 2.5);
            return {
              x: direction > 0 ? horizontal * scale : width - horizontal * scale,
              y: height / 2 - height * scale / 2 - Math.sin(eased * Math.PI) * position * height * 0.12
                + flutter * (ripple * position * 9 + layer * 5),
              h: height * scale
            };
          };
          const left = project(x, z), right = project(nextX, nextZ);
          const dx = right.x - left.x;
          if (Math.abs(dx) > 0.01) {
            ctx.save();
            ctx.transform(dx / step, (right.y - left.y) / step, 0, left.h / height, left.x, left.y);
            if (Math.cos(angle) > 0 && layer === 0) {
              const sourceX = direction > 0 ? i * step : width - (i + 1) * step;
              if (direction < 0) { ctx.translate(step, 0); ctx.scale(-1, 1); }
              ctx.drawImage(texture, sourceX * ratio, 0, step * ratio, texture.height, 0, 0, step + 0.7, height);
              ctx.fillStyle = `rgba(0,0,0,${Math.sin(angle) * 0.12})`;
            } else {
              ctx.fillStyle = layer === 0 ? '#faf9f6' : ['#fff', '#f6f5f2', '#eeede9', '#faf9f6', '#e8e7e3'][layer];
              ctx.fillRect(0, 0, step + 0.7, height);
              ctx.fillStyle = `rgba(0,0,0,${Math.abs(Math.sin(angle)) * 0.16})`;
            }
            ctx.fillRect(0, 0, step + 0.7, height);
            ctx.restore();
          }
          x = nextX;
          z = nextZ;
        }
        // A fine free-edge line makes the separate ruffling leaves visible.
        if (flutter > 0.001) {
          const scale = 1 + z / (width * 2.5);
          const edgeX = direction > 0 ? x * scale : width - x * scale;
          const edgeRipple = Math.sin(Math.PI * 4 - progress * Math.PI * 6 + layer * 0.6);
          const edgeY = height / 2 - height * scale / 2 - Math.sin(eased * Math.PI) * height * 0.12
            + flutter * (edgeRipple * 9 + layer * 5);
          ctx.beginPath();
          ctx.moveTo(edgeX, edgeY);
          ctx.lineTo(edgeX, edgeY + height * scale);
          ctx.strokeStyle = `rgba(90,85,75,${flutter * 0.26})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        }
        if (progress < 1) requestAnimationFrame(frame);
        else { sheet.remove(); finish(); }
      }
      requestAnimationFrame(frame);
    }
    back.addEventListener('click', () => turn(-1));
    next.addEventListener('click', () => turn(1));
  </script>
</body>
</html>
